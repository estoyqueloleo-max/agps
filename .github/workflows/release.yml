name: Build & Release APK

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decrypt secrets with SOPS
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ -n "$SOPS_AGE_KEY" ]; then
            curl -sLO https://github.com/getsops/sops/releases/download/v3.9.0/sops-v3.9.0.linux.amd64
            chmod +x sops-v3.9.0.linux.amd64
            sudo mv sops-v3.9.0.linux.amd64 /usr/local/bin/sops
            sops -d --input-type dotenv --output-type dotenv secrets.enc.properties > secrets.properties
          else
            echo "SOPS_AGE_KEY secret not set, skipping secrets decryption."
          fi

      - name: Run Unit & Visual Tests
        run: ./gradlew testCommunityDebugUnitTest testTronDebugUnitTest --stacktrace

      - name: Build Release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Assets
        id: prepare_apk
        run: |
          mkdir -p release-assets
          COMMUNITY_APK="app/build/outputs/apk/community/release/app-community-release.apk"
          TRON_APK="app/build/outputs/apk/tron/release/app-tron-release.apk"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG_OR_REF="PR-${{ github.event.pull_request.number }}"
          else
            TAG_OR_REF="${{ github.ref_name }}"
            if [ -z "$TAG_OR_REF" ] || [ "$TAG_OR_REF" = "master" ]; then
              TAG_OR_REF="latest"
            fi
          fi

          if [ -f "$COMMUNITY_APK" ]; then
            cp "$COMMUNITY_APK" "release-assets/AGPS-Tracker-Community-${TAG_OR_REF}.apk"
            cp "$COMMUNITY_APK" "release-assets/AGPS-Tracker-Community.apk"
            echo "community_apk=release-assets/AGPS-Tracker-Community.apk" >> $GITHUB_OUTPUT
          else
            echo "Error: Community Release APK not found!" >&2
            exit 1
          fi

          if [ -f "$TRON_APK" ]; then
            cp "$TRON_APK" "release-assets/AGPS-Tracker-Tron-${TAG_OR_REF}.apk"
            cp "$TRON_APK" "release-assets/AGPS-Tracker-Tron.apk"
            echo "tron_apk=release-assets/AGPS-Tracker-Tron.apk" >> $GITHUB_OUTPUT
          else
            echo "Error: Tron Release APK not found!" >&2
            exit 1
          fi

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGPS-Tracker-APKs${{ github.event_name == 'pull_request' && format('-PR-{0}', github.event.pull_request.number) || '' }}
          path: release-assets/*.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
