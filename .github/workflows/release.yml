name: Build & Release APK

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decrypt secrets with SOPS
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ -n "$SOPS_AGE_KEY" ]; then
            curl -sLO https://github.com/getsops/sops/releases/download/v3.9.0/sops-v3.9.0.linux.amd64
            chmod +x sops-v3.9.0.linux.amd64
            sudo mv sops-v3.9.0.linux.amd64 /usr/local/bin/sops
            sops -d --input-type dotenv --output-type dotenv secrets.enc.properties > secrets.properties
          else
            echo "SOPS_AGE_KEY secret not set, skipping secrets decryption."
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        id: prepare_apk
        run: |
          mkdir -p release-assets
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$RELEASE_APK" ]; then
            TAG_OR_REF="${{ github.ref_name }}"
            if [ -z "$TAG_OR_REF" ] || [ "$TAG_OR_REF" = "main" ]; then
              TAG_OR_REF="latest"
            fi
            cp "$RELEASE_APK" "release-assets/AGPS-Tracker-Community-${TAG_OR_REF}.apk"
            cp "$RELEASE_APK" "release-assets/AGPS-Tracker-Community.apk"
            echo "apk_path=release-assets/AGPS-Tracker-Community.apk" >> $GITHUB_OUTPUT
            echo "named_apk_path=release-assets/AGPS-Tracker-Community-${TAG_OR_REF}.apk" >> $GITHUB_OUTPUT
          else
            echo "Error: Release APK not found!" >&2
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGPS-Tracker-Community-APK
          path: release-assets/*.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
