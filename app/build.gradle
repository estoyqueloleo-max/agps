plugins {
    id 'com.android.application'
}

def sftpProps = new Properties()
def secretsFile = rootProject.file("secrets.properties")
def secretsEncFile = rootProject.file("secrets.enc.properties")

if (!secretsFile.exists() && secretsEncFile.exists()) {
    try {
        def sopsBin = "sops"
        def userHome = System.getProperty("user.home")
        if (new File(userHome, "go/bin/sops").exists()) {
            sopsBin = new File(userHome, "go/bin/sops").absolutePath
        }
        def projectAgeKey = rootProject.file(".age-key.txt")
        def ageKeyFile = projectAgeKey.exists() ? projectAgeKey : new File(userHome, ".config/sops/age/keys.txt")
        def envList = []
        System.getenv().each { k, v -> envList << "$k=$v" }
        if (ageKeyFile.exists() && !System.getenv().containsKey("SOPS_AGE_KEY_FILE")) {
            envList << "SOPS_AGE_KEY_FILE=${ageKeyFile.absolutePath}"
        }
        def sout = new ByteArrayOutputStream()
        def serr = new ByteArrayOutputStream()
        def proc = [sopsBin, "-d", "--input-type", "dotenv", "--output-type", "dotenv", secretsEncFile.absolutePath].execute(envList, rootProject.projectDir)
        proc.consumeProcessOutput(sout, serr)
        proc.waitFor()
        if (proc.exitValue() == 0) {
            secretsFile.text = sout.toString()
        }
    } catch (Exception ignored) {
    }
}

if (secretsFile.exists()) {
    secretsFile.withInputStream { sftpProps.load(it) }
}

android {
	namespace "com.giobat.AgpsTrackerPP"
    compileSdkVersion 34

    defaultConfig {
        applicationId 'com.giobat.AgpsTrackerPP.community'
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 99
        versionName "0.1.1"
        multiDexEnabled true

        def sftpHost = System.getenv("SFTP_HOST") ?: sftpProps.getProperty("SFTP_HOST", "agps-tracker.cloud")
        def sftpUser = System.getenv("SFTP_USER") ?: sftpProps.getProperty("SFTP_USER", "giobat")
        def sftpPass = System.getenv("SFTP_PASS") ?: sftpProps.getProperty("SFTP_PASS", "")

        buildConfigField "String", "SFTP_HOST", "\"${sftpHost}\""
        buildConfigField "String", "SFTP_USER", "\"${sftpUser}\""
        buildConfigField "String", "SFTP_PASS", "\"${sftpPass}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        community {
            storeFile file("community.keystore")
            storePassword System.getenv("KEYSTORE_PASS") ?: "agpstracker"
            keyAlias System.getenv("KEY_ALIAS") ?: "community"
            keyPassword System.getenv("KEY_PASS") ?: "agpstracker"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.community
        }
        debug {
            signingConfig signingConfigs.community
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }
    lint {
        abortOnError false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
